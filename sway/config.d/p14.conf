# ~/.config/sway/config.d/p14.conf
# Host-specific: ThinkPad P14 AMD, 1920x1200 panel, amdgpu.

# The panel's output line lives below, AFTER the external-monitor
# wildcard -- see the note there for why the order matters.

input type:touchpad {
    tap enabled
    natural_scroll disabled
    dwt enabled
    scroll_method two_finger
}

# Lid close/open
# bindswitch --reload --locked lid:on output eDP-1 disable
# bindswitch --reload --locked lid:off output eDP-1 enable

bar {
        status_command i3status
        position bottom
}

# --- Occasional external monitor (meetings) --------------------------
# For whatever gets plugged in -- a meeting room display, a projector,
# a dock -- 1920 = the panel's width, so it starts exactly where the
# built-in screen ends. No need to know its name ahead of time.
#
# BUT `output *` matches EVERY output, including eDP-1, and sway merges
# a wildcard into every output config defined before it. So the panel's
# position must come AFTER the wildcard to win; with it before (or
# missing) both outputs sat at 1920,0, overlapped, and the external
# display looked like a mirror of the laptop.
# scale 2: meeting displays are typically 4K TVs/projectors viewed from
# across a room, so render them like 1080p. (eDP-1 below resets to 1.)
output * position 1920,0 scale 2
# 1920x1200 native -- no fractional scaling needed, so no XWayland blur
# concern here. Confirm the connector name with `swaymsg -t get_outputs`
# if this isn't eDP-1.
output eDP-1 scale 1 position 0,0

# Move focus / the current workspace to whichever output is connected.
# Same binding works whether the P14 has zero or one external displays --
# "output right" resolves to nothing if there isn't a second output, so
# these are safe to leave bound permanently rather than just for meetings.
bindsym $mod+o focus output right
bindsym $mod+Shift+o move workspace to output right

# Dedicated workspace for presenting. Doesn't hardcode an output name --
# just switch to it, then use $mod+Shift+o above to send it to the
# external display once it's connected.
set $ws11 "11: meeting"
bindsym $mod+F2 workspace number $ws11
bindsym $mod+Shift+F2 move container to workspace number $ws11

# When one of these connectors shows up, sway opens the meeting workspace
# on it instead of inventing a fresh numbered one, so the external screen
# shows ONLY the meeting workspace and 1-10 stay on the panel. `workspace
# ... output` takes a list and uses the first one present; it doesn't
# accept `*`, so this lists the connector names a P14 can expose (HDMI
# port, USB-C/DP alt mode, docks). With none connected it is a no-op.
workspace $ws11 output HDMI-A-1 HDMI-A-2 DP-1 DP-2 DP-3 DP-4 DP-5 DP-6

# Idle inhibit toggle for mid-meeting: pauses swayidle so the panel
# doesn't blank or lock while you're presenting and not touching the
# keyboard. Resume after.
bindsym $mod+Shift+i exec pkill -STOP swayidle
bindsym $mod+Shift+u exec pkill -CONT swayidle

# Laptop: blanking the panel on idle is desirable for battery, so
# (unlike the Meerkat) this includes `output * power off`. There's no
# i915-style hotplug bug on amdgpu to avoid here.
exec --no-startup-id swayidle -w \
    timeout 300 'swaymsg "output * power off"' \
    resume 'swaymsg "output * power on"' \
    timeout 5400 'swaylock -f -c 000000' \
    before-sleep 'swaylock -f -c 000000'
