 # ~/.config/sway/config.d/meerkat.conf
# Host-specific: System76 Meerkat, dual HDMI, Intel i915.

# CHANGED: sway output names include the connector subtype: HDMI-A-1, not HDMI-1.
# Confirm with:  swaymsg -t get_outputs
set $primary HDMI-A-1
set $secondary HDMI-A-2

# xrandr "--rotate left" (counter-clockwise) maps to sway "transform 270",
# since sway rotates clockwise. If it comes up upside down, use 90.
# The x-offset for $primary must equal the ROTATED width of $secondary
# (its native HEIGHT). 1080 assumes a 1920x1080 secondary -- confirm
# against `swaymsg -t get_outputs` and adjust if wrong.
output $secondary transform 270 position 0,0
output $primary position 1080,0

workspace 1 output $primary
workspace 2 output $primary
workspace 3 output $primary
workspace 4 output $primary
workspace 5 output $primary
workspace 6 output $primary
workspace 7 output $primary
workspace 8 output $primary
workspace 9 output $primary
workspace 10 output $primary

workspace "claude" output $secondary
bindsym $mod+c workspace "claude"
bindsym $mod+Shift+c move container to workspace "claude"

bar {
        status_command i3status
        output $secondary
        tray_output $secondary
        position bottom
}

# Lock on idle, but deliberately do NOT power off outputs.
# `output * power off` is the DPMS-off that triggers the i915
# i915_hotplug_work_func storm on this machine -- see the dmesg
# investigation. Screens stay on; only the lock timer applies.
exec --no-startup-id swayidle -w \
    timeout 5400 'swaylock -f -c 000000' \
    before-sleep 'swaylock -f -c 000000'
