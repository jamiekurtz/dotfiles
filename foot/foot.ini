# ~/.config/foot/foot.ini
# Symlink from ~/dotfiles/foot/foot.ini

[main]
# "Mono" variant forces icon glyphs into a single cell -- the one you
# want for a terminal. The plain "Nerd Font" variant is for GUI apps/bars.
font=JetBrainsMono Nerd Font Mono:size=11
font-bold=JetBrainsMono Nerd Font Mono:style=Bold:size=11
font-italic=JetBrainsMono Nerd Font Mono:style=Italic:size=11
font-bold-italic=JetBrainsMono Nerd Font Mono:style=Bold Italic:size=11

# Slight cell padding, centered
pad=6x6 center

[scrollback]
lines=10000

[mouse]
hide-when-typing=yes

[cursor]
style=beam
blink=yes

[colors]
# Default foot palette (close to Solarized-ish neutrals). Replace
# wholesale later if you adopt a specific theme -- foot themes are
# just palettes, so a full 16-color block goes here.
background=1e1e1e
foreground=d8d8d8

regular0=1e1e1e   # black
regular1=cc6666   # red
regular2=b5bd68   # green
regular3=f0c674   # yellow
regular4=81a2be   # blue
regular5=b294bb   # magenta
regular6=8abeb7   # cyan
regular7=d8d8d8   # white

bright0=666666
bright1=d54e53
bright2=b9ca4a
bright3=e7c547
bright4=7aa6da
bright5=c397d8
bright6=70c0b1
bright7=eaeaea

[key-bindings]
# Defaults are sane; override here only if something conflicts with a
# Sway keybinding. Left empty on purpose for now.
